name: Build and Deploy Clinical Portal

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Compile C Backend
        run: |
          mkdir -p public
          cp index.html style.css public/
          emcc clinic_core.c -o public/clinic_core.js \
            -sEXPORTED_FUNCTIONS='["_register_patient","_consult_next_patient","_undo_last_consultation","_fetch_clinic_state_json"]' \
            -sEXPORTED_RUNTIME_METHODS='["cwrap"]'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - uses: actions/deploy-pages@v4
