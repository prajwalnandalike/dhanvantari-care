name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Compile C code
      run: gcc -Wall *.c -o program
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
